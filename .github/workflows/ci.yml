name: ci
on:
  push:
  pull_request:
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        char_mode: [signed, unsigned]
    env:
      CFLAGS: -std=c99 -O2 -g -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Werror -f${{ matrix.char_mode }}-char
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Numerical test dependency
        run: python3 -m pip install numpy
      - name: All host tests (C sanitizers, PTY, Python)
        run: make test
      - name: Shell script syntax
        run: find scripts tools linux/inference -name '*.sh' -exec bash -n {} \;
  mcu-builds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Fetch pinned firmware reference
        run: git submodule update --init -- third_party/nucleo-f446re-freertos
      - name: Build and link STM32F446RE firmware
        run: make firmware
      - name: Compile protocol for STM32H7 (Cortex-M7, WBR target)
        run: |
          arm-none-eabi-gcc -mcpu=cortex-m7 -mthumb -mfloat-abi=hard -mfpu=fpv5-d16 \
            -std=c99 -Os -Wall -Wextra -Wconversion -Werror \
            -Iprotocol/include -c protocol/src/hea_proto.c -o hea_proto_m7.o
          arm-none-eabi-size hea_proto_m7.o
